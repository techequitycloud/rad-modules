steps:
- id: 'Prepare Deployment Environment'
  name: '${_TERRAFORM_IMAGE_NAME}:latest'
  secretEnv: ['GIT_TOKEN']
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    # Copy the pipeline's own scripts out of /workspace BEFORE the wipes below
    # delete everything in it. /workspace starts as a checkout of this repo;
    # afterwards it is the MODULE's repo and these files are gone.
    # Fail loudly here rather than let step 2 die with "no such file".
    mkdir -p /pipeline
    if [ ! -d rad-ui/automation/scripts ]; then
        echo "❌ rad-ui/automation/scripts not found in the initial workspace"
        exit 1
    fi
    cp -a rad-ui/automation/scripts/. /pipeline/
    chmod +x /pipeline/*.sh

    echo "🚀 DEPLOYMENT UPDATE INITIATED"
    echo "========================================"
    echo "Module: ${_MODULE_NAME}"
    echo "Deployment ID: ${_DEPLOYMENT_ID}"
    echo "Project: ${PROJECT_ID}"
    echo "Bucket: ${_DEPLOYMENT_BUCKET_ID}"
    echo "Timestamp: $(date)"
    echo "========================================"

    # Function to log with timestamp
    log() {
        echo "[$(date +'%H:%M:%S')] $$1"
    }

    log "🧹 Cleaning workspace..."
    # Clean workspace to ensure fresh clone
    find /workspace -mindepth 1 -delete 2>/dev/null || true

    log "🔍 Checking for existing deployment metadata..."

    FILES_PATH="gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/files"

    # Try to download repo metadata from GCS
    if gsutil cp "$$FILES_PATH/repo_url.txt" . >/dev/null 2>&1; then
        log "✅ Found repo_url.txt in GCS"
    else
        log "ℹ️  repo_url.txt not found in GCS"
    fi

    # Read stored values
    STORED_REPO_URL=""
    if [ -f "repo_url.txt" ] && [ -s "repo_url.txt" ]; then
        STORED_REPO_URL=$$(cat repo_url.txt)
        log "ℹ️  Stored repository URL: $$STORED_REPO_URL"
    fi

    # Helper: clone a repo
    # Returns 0 on success (clone succeeded AND module directory exists).
    try_clone() {
        local repo="$$1"
        if [ -z "$$repo" ] || [ "$$repo" = "none" ]; then return 1; fi

        log "📥 Trying to clone: $$repo"

        # Clean workspace before clone attempt
        find /workspace -mindepth 1 -delete 2>/dev/null || true

        if ! git clone "https://$$GIT_TOKEN@github.com/$$repo.git" /workspace 2>&1; then
            log "⚠️  Clone failed for $$repo"
            return 1
        fi

        if [ ! -d "/workspace/modules/${_MODULE_NAME}" ]; then
            log "⚠️  Cloned $$repo but module ${_MODULE_NAME} not found — skipping"
            return 1
        fi

        log "✅ Successfully cloned $$repo (module ${_MODULE_NAME} found)"
        return 0
    }

    # Attempt clones in priority order:
    #   1. _MODULE_GIT_REPO_URL  — explicit override
    #   2. STORED_REPO_URL       — from previous deployment
    #   3. _GIT_REPO_URL         — platform default
    #   4. Default fallback

    CLONE_SUCCESS=false
    RESOLVED_REPO=""

    if [ -n "${_MODULE_GIT_REPO_URL}" ] && [ "${_MODULE_GIT_REPO_URL}" != "none" ] && [ "${_MODULE_GIT_REPO_URL}" != "" ]; then
        if try_clone "${_MODULE_GIT_REPO_URL}"; then
            CLONE_SUCCESS=true
            RESOLVED_REPO="${_MODULE_GIT_REPO_URL}"
        fi
    fi

    if [ "$$CLONE_SUCCESS" != "true" ] && [ -n "$$STORED_REPO_URL" ]; then
        if try_clone "$$STORED_REPO_URL"; then
            CLONE_SUCCESS=true
            RESOLVED_REPO="$$STORED_REPO_URL"
        fi
    fi

    if [ "$$CLONE_SUCCESS" != "true" ] && [ -n "${_GIT_REPO_URL}" ] && [ "${_GIT_REPO_URL}" != "none" ] && [ "${_GIT_REPO_URL}" != "" ]; then
        if try_clone "${_GIT_REPO_URL}"; then
            CLONE_SUCCESS=true
            RESOLVED_REPO="${_GIT_REPO_URL}"
        fi
    fi

    if [ "$$CLONE_SUCCESS" != "true" ]; then
        if try_clone "techequitycloud/rad-modules"; then
            CLONE_SUCCESS=true
            RESOLVED_REPO="techequitycloud/rad-modules"
        fi
    fi

    if [ "$$CLONE_SUCCESS" != "true" ]; then
        log "⚠️  All clone attempts failed for module ${_MODULE_NAME}"
        log "🔄 Attempting GCS archive fallback for module ${_MODULE_NAME}..."

        ARCHIVE_PATH="$$FILES_PATH/${_MODULE_NAME}.tar.gz"
        if gsutil ls "$$ARCHIVE_PATH" > /dev/null 2>&1; then
            log "📦 Found deployment archive in GCS — restoring module source code..."
            find /workspace -mindepth 1 -delete 2>/dev/null || true
            mkdir -p "/workspace/modules/${_MODULE_NAME}"
            gsutil cp "$$ARCHIVE_PATH" /tmp/fallback.tar.gz
            tar -xzf /tmp/fallback.tar.gz -C "/workspace/modules/${_MODULE_NAME}"
            rm -f /tmp/fallback.tar.gz
            if [ -d "/workspace/modules/${_MODULE_NAME}" ] && \
               ls /workspace/modules/${_MODULE_NAME}/*.tf > /dev/null 2>&1; then
                log "✅ Module source code restored from GCS archive (module was removed from git)"
                CLONE_SUCCESS=true
                RESOLVED_REPO="gcs-archive:$$FILES_PATH"
            else
                log "❌ GCS archive did not contain valid Terraform source for ${_MODULE_NAME}"
            fi
        else
            log "❌ No deployment archive found in GCS at: $$ARCHIVE_PATH"
        fi
    fi

    if [ "$$CLONE_SUCCESS" != "true" ]; then
        log "❌ All recovery attempts failed for module ${_MODULE_NAME}"
        log "   Could not obtain module source from git or GCS archive."
        exit 1
    fi

    echo "$$RESOLVED_REPO" > /workspace/resolved_repo.txt

    # Navigate to module directory
    cd "/workspace/modules/${_MODULE_NAME}"

    log "⬇️  Downloading configuration files..."

    # Download terraform.tfvars.json
    if gsutil cp "$$FILES_PATH/terraform.tfvars.json" ./terraform.tfvars.json; then
        log "✅ Downloaded terraform.tfvars.json"
        log "🔍 Verifying configuration:"
        cat terraform.tfvars.json | jq '.' || log "Unable to parse JSON"
    else
        log "⚠️  terraform.tfvars.json not found"
    fi

    # Download backend.tf
    if gsutil cp "$$FILES_PATH/backend.tf" ./backend.tf; then
        log "✅ Downloaded backend.tf"
    else
        log "⚠️  backend.tf not found"
    fi

    # Restore previous Terraform state from the deployment archive.
    # The create pipeline stores terraform.tfstate inside the deployment
    # archive. Without restoring it here, tofu sees empty state, regenerates
    # random_id.wrapper_deployment with a new hex value, and every resource
    # name changes — causing a full destroy + recreate instead of an
    # in-place update. If a remote GCS backend is configured via backend.tf,
    # the state file will not be present in the archive and this is a no-op.
    log "📦 Restoring previous Terraform state..."
    if gsutil cp "$$FILES_PATH/${_MODULE_NAME}.tar.gz" /tmp/previous.tar.gz 2>/dev/null; then
        # Extract only the state files — skip .terraform/ (stale provider
        # binaries) and .tf source files (come from the fresh git clone).
        tar -xzf /tmp/previous.tar.gz \
            --wildcards \
            './terraform.tfstate' \
            './terraform.tfstate.backup' \
            2>/dev/null || true
        rm -f /tmp/previous.tar.gz
        if [ -f "terraform.tfstate" ]; then
            log "✅ Previous Terraform state restored (local backend)"
        else
            log "ℹ️  No local state in archive — state managed by remote backend"
        fi
    else
        log "ℹ️  No previous archive found in GCS — assuming remote backend or first deploy"
    fi

    log "✅ Deployment environment prepared"
    log "📋 Module contents:"
    ls -la . || true

  dir: /workspace
  volumes:
  - name: 'pipeline-scripts'
    path: '/pipeline'


- id: 'Initialize and Plan'
  name: '${_TERRAFORM_IMAGE_NAME}:latest'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    log() {
        echo "[$(date +'%H:%M:%S')] $$1"
    }

    log "🔧 Initializing Terraform/Tofu..."

    # Restore Terraform provider cache from GCS to avoid re-downloading binaries
    CACHE_DIR="/workspace/.terraform-plugin-cache"
    CACHE_GCS_PATH="gs://${_DEPLOYMENT_BUCKET_ID}/terraform-provider-cache/${_MODULE_NAME}/providers.tar.gz"
    mkdir -p "$$CACHE_DIR"
    export TF_PLUGIN_CACHE_DIR="$$CACHE_DIR"

    log "📥 Attempting to restore Terraform provider cache..."
    if gsutil cp "$$CACHE_GCS_PATH" /tmp/providers.tar.gz 2>/dev/null; then
        tar -xzf /tmp/providers.tar.gz -C "$$CACHE_DIR" 2>/dev/null || true
        rm -f /tmp/providers.tar.gz
        log "✅ Provider cache restored from GCS"
    else
        log "ℹ️  No provider cache found — providers will be downloaded fresh"
    fi

    # Checksum the cache before init so we can skip the upload if nothing changed
    CACHE_CHECKSUM_BEFORE=$$(find "$$CACHE_DIR" -type f | sort | xargs md5sum 2>/dev/null | md5sum || echo "empty")

    tofu init -reconfigure

    # A concurrent build for THIS deployment is the one case the lock clear
    # below must not paper over. Ask Cloud Build directly rather than trusting
    # the caller-side claim: on 2026-08-19 a solution update published an
    # UPDATE for four members whose CREATE (released moments earlier by
    # resolveWaitingDependents when Services_GCP succeeded) was still applying.
    # Both builds then ran against one state file, the second cleared the
    # first's lock as "stale", and BOTH failed -- the update on "Saved plan is
    # stale", the create on "Error releasing the state lock: object doesn't
    # exist" -- after the create had already built 46 real resources.
    #
    # Refusing is better than queueing here: the deployment is left in a
    # terminal state the operator can retry, rather than two applies silently
    # interleaving on one state.
    # `--ongoing` (WORKING + QUEUED) and match the deployment id CLIENT-side.
    # Filtering server-side on substitutions._DEPLOYMENT_ID scans the whole
    # build history and times out — measured >150s on this project, which
    # inside a build step is a hang, not a check. `--ongoing` returns in ~1s
    # because live builds are few.
    OTHER_BUILDS=$$(gcloud builds list \
        --project="${PROJECT_ID}" \
        --ongoing \
        --format="value(id,substitutions._DEPLOYMENT_ID)" \
        --limit=100 2>/dev/null \
        | awk -v d="${_DEPLOYMENT_ID}" -v self="${BUILD_ID}" '$$2 == d && $$1 != self { print $$1 }' \
        || true)
    if [ -n "$$OTHER_BUILDS" ]; then
        log "❌ Another build for deployment ${_DEPLOYMENT_ID} is already running:"
        for b in $$OTHER_BUILDS; do log "     $$b"; done
        log "   Two builds share one Terraform state file, so running both corrupts"
        log "   the lock and fails them BOTH. Wait for that build to finish, then"
        log "   retry this deployment from the RAD dashboard."
        exit 1
    fi

    # Clear a state lock left behind by a previous build for THIS deployment
    # that was hard-killed (Cloud Build timeout, OOM, manual cancellation)
    # before it could release it — GCS backend locking has no automatic
    # staleness expiry, so an orphaned lock silently blocks every future
    # build for this deployment (including a user's own retry) indefinitely.
    # Safe unconditionally: the webapp's own idempotency claim
    # (S6-style, updateDeployment) only lets a new build start for this
    # deployment once the previous one has already reached a terminal
    # Firestore status, itself only set after Cloud Build reports that build
    # as finished — so any process that could still legitimately hold this
    # lock is already gone by the time this build starts. That premise was
    # FALSIFIED on 2026-08-19 (see the concurrency check above, which now
    # verifies it instead of assuming it). Confirmed live
    # 2026-08-06: a Medusa_CloudRun build's Cloud Build timeout orphaned
    # this exact lock and blocked every subsequent retry until manually
    # cleared.
    LOCK_PATH="gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/state/default.tflock"
    if gsutil stat "$$LOCK_PATH" >/dev/null 2>&1; then
        log "⚠️  Found a leftover state lock from a previous build — clearing it"
        gsutil rm "$$LOCK_PATH" || log "⚠️  Failed to clear stale lock (may have already cleared itself)"
    fi

    # Only re-upload the provider cache if it changed
    CACHE_CHECKSUM_AFTER=$$(find "$$CACHE_DIR" -type f | sort | xargs md5sum 2>/dev/null | md5sum || echo "empty")
    if [ "$$CACHE_CHECKSUM_BEFORE" != "$$CACHE_CHECKSUM_AFTER" ]; then
        log "📤 Provider cache changed — saving to GCS..."
        if tar -czf /tmp/providers.tar.gz -C "$$CACHE_DIR" . 2>/dev/null && \
           gsutil cp /tmp/providers.tar.gz "$$CACHE_GCS_PATH" 2>/dev/null; then
            log "✅ Provider cache saved to GCS"
        else
            log "⚠️  Failed to save provider cache (non-critical)"
        fi
        rm -f /tmp/providers.tar.gz
    else
        log "ℹ️  Provider cache unchanged — skipping upload"
    fi

    log "📋 Generating execution plan..."

    # Generate plan with detailed exit code.
    # tee so the output can be inspected for the cycle signature below;
    # PIPESTATUS[0] because $$? would be tee's status, not tofu's.
    set +e
    tofu plan -input=false -out=tfplan -detailed-exitcode 2>&1 | tee /workspace/plan_output.log
    PLAN_EXIT_CODE=$${PIPESTATUS[0]}
    set -e

    case $$PLAN_EXIT_CODE in
        0)
            log "ℹ️  No changes required - infrastructure is up to date"
            ;;
        2)
            log "📊 Changes detected - plan generated successfully"
            ;;
        *)
            log "❌ Planning failed with exit code: $$PLAN_EXIT_CODE"

            # Cycle diagnosis and two-phase recovery live in
            # /pipeline/handle_plan_cycle.sh, NOT here. Cloud Build caps a step
            # arg at 10,000 chars and rejects the whole build config above it --
            # no build is created at all, the deployment just reads
            # INTERNAL_ERROR with nothing in the console to inspect. Inlining
            # this logic took the step to 12,429 chars and broke UPDATE for
            # every module until it was reverted (#977 -> #978). Keep it thin.
            #
            # Strip ANSI first: Terraform colourises "Error:" SEPARATELY from the
            # message after it, so raw bytes read
            #   ESC[31mError: ESC[0mESC[1mCycle: module...
            # and a grep for the literal "Error: Cycle" matches NOTHING. This
            # silently failed to fire on build c0216e05 for exactly that reason.
            sed -e 's/\x1b\[[0-9;]*m//g' /workspace/plan_output.log \
                > /workspace/plan_output.clean.log 2>/dev/null || true

            # Exit 0 means it recovered and rewrote tfplan; anything else means
            # fail the build as before.
            RECOVERED=0
            if [ -x /pipeline/handle_plan_cycle.sh ]; then
                set +e
                /pipeline/handle_plan_cycle.sh \
                    /workspace/plan_output.clean.log \
                    "${_MODULE_NAME}" "${_DEPLOYMENT_ID}" "${_DEPLOYMENT_BUCKET_ID}"
                [ $$? -eq 0 ] && RECOVERED=1
                set -e
            fi

            if [ "$$RECOVERED" -eq 1 ]; then
                PLAN_EXIT_CODE=2
            else
                exit 1
            fi
            ;;
    esac

    log "✅ Initialization and planning completed"
  # Step 0 wipes /workspace, so handle_plan_cycle.sh is read from this shared
  # volume, which step 0 copied the whole scripts directory into.
  volumes:
  - name: 'pipeline-scripts'
    path: '/pipeline'
  dir: /workspace/modules/${_MODULE_NAME}

- id: 'Apply Infrastructure Changes'
  name: '${_TERRAFORM_IMAGE_NAME}:latest'
  entrypoint: 'bash'
  args:
  - '/pipeline/apply_infrastructure_update.sh'
  # Cloud Build expands substitutions in this file, never inside a script file,
  # so the three the script needs are handed over as environment variables.
  env:
  - 'MODULE_NAME=${_MODULE_NAME}'
  - 'DEPLOYMENT_ID=${_DEPLOYMENT_ID}'
  - 'DEPLOYMENT_BUCKET_ID=${_DEPLOYMENT_BUCKET_ID}'
  # Step 0 wipes /workspace, so the script is read from this shared volume,
  # which it was copied into beforehand.
  volumes:
  - name: 'pipeline-scripts'
    path: '/pipeline'
  dir: /workspace/modules/${_MODULE_NAME}

- id: 'Refresh State and Generate Outputs'
  name: '${_TERRAFORM_IMAGE_NAME}:latest'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    log() {
        echo "[$(date +'%H:%M:%S')] $$1"
    }

    log "🔄 Refreshing Terraform state..."

    # ── Persist state on failure (option B) ──────────────────────────────
    # This step runs a second apply for Kubernetes resources, which can fail
    # mid-way. As above, persist the local state archive on EXIT so resources
    # created during a failed apply are not lost (which would cause
    # "already exists" errors on the next run). No-op for remote GCS backends.
    FILES_PATH="gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/files"
    persist_state_to_gcs() {
        if [ -f "/workspace/modules/${_MODULE_NAME}/terraform.tfstate" ]; then
            log "💾 Persisting Terraform state to GCS..."
            if tar -hczf "/tmp/${_MODULE_NAME}-state.tar.gz" -C "/workspace/modules/${_MODULE_NAME}" . 2>/dev/null \
               && gsutil -q cp "/tmp/${_MODULE_NAME}-state.tar.gz" "$$FILES_PATH/${_MODULE_NAME}.tar.gz"; then
                log "✅ Terraform state persisted to GCS"
            else
                log "⚠️  Failed to persist Terraform state to GCS (non-critical)"
            fi
            rm -f "/tmp/${_MODULE_NAME}-state.tar.gz"
        fi
    }
    trap persist_state_to_gcs EXIT

    # Capture kubernetes_ready before the refresh (for logging purposes).
    # NOTE: On a fresh GKE deployment the first apply (Step 3) creates the
    # cluster and immediately sets kubernetes_ready=true in state. By the time
    # we reach this step the output is already "true", so the false→true
    # transition happened inside Step 3 rather than here. We therefore cannot
    # rely on a before/after transition to decide whether a second apply is
    # needed. Instead we always attempt a second plan when kubernetes_ready=true
    # and let the plan exit code tell us whether there is anything left to
    # deploy (exit 2 = changes, exit 0 = no-op).
    #
    # NOTE: jq's '//' alternative operator returns the right-hand side for both
    # null AND false, so '.kubernetes_ready.value // true' would incorrectly
    # return "true" when kubernetes_ready is false. Use an explicit has() check
    # instead so the fallback only fires when the output key is absent (i.e.
    # for non-GKE modules that never declare this output).
    KUBERNETES_READY_BEFORE=$$(tofu output -json 2>/dev/null \
        | jq -r 'if has("kubernetes_ready") then (.kubernetes_ready.value | tostring) else "true" end' 2>/dev/null \
        || echo "true")
    log "📊 kubernetes_ready before refresh: $$KUBERNETES_READY_BEFORE"

    if tofu apply -refresh-only -auto-approve; then
        log "✅ State refresh completed"
    else
        log "⚠️  State refresh failed, but continuing..."
    fi

    # Capture kubernetes_ready after the refresh
    KUBERNETES_READY_AFTER=$$(tofu output -json 2>/dev/null \
        | jq -r 'if has("kubernetes_ready") then (.kubernetes_ready.value | tostring) else "true" end' 2>/dev/null \
        || echo "true")
    log "📊 kubernetes_ready after refresh: $$KUBERNETES_READY_AFTER"

    # When kubernetes_ready=true, always attempt a second plan+apply.
    #
    # On a fresh GKE deployment the first apply was planned before the cluster
    # existed (kubernetes_ready=false at plan time), so ALL Kubernetes resources
    # were excluded. The cluster was created in Step 3, which set
    # kubernetes_ready=true. A second plan now sees kubernetes_ready=true and
    # includes the pending Kubernetes resources (Namespace, SA, Secrets, Jobs,
    # Deployment, Service, HPA, …).
    #
    # On subsequent UPDATE runs where the cluster already existed (and all
    # Kubernetes resources were included in the first plan), this second plan
    # returns exit code 0 (no changes) — making it a safe no-op.
    #
    # The second apply uses its own retry function with the same stale-plan
    # protection as the first apply: after any failed attempt we refresh state
    # and re-plan before retrying, rather than reusing a stale tfplan-k8s.
    if [ "$$KUBERNETES_READY_AFTER" = "true" ]; then
        log "🔄 kubernetes_ready=true — running second plan to deploy any pending Kubernetes resources..."

        set +e
        tofu plan -out=tfplan-k8s -detailed-exitcode
        PLAN_EXIT_CODE=$$?
        set -e

        case $$PLAN_EXIT_CODE in
            0)
                log "ℹ️  No additional Kubernetes resource changes detected"
                ;;
            2)
                log "📊 Kubernetes resources pending — applying..."

                k8s_apply_once() {
                    local plan_file="tfplan-k8s"

                    log "🔄 Applying Kubernetes resources..."

                    set +e
                    tofu apply -auto-approve $$plan_file 2>&1 | tee /tmp/k8s_apply_output.txt
                    K8S_APPLY_EXIT_CODE=$${PIPESTATUS[0]}
                    set -e

                    if [ $$K8S_APPLY_EXIT_CODE -eq 0 ]; then
                        log "✅ K8s apply succeeded"
                        return 0
                    fi

                    log "❌ K8s apply failed (exit code: $$K8S_APPLY_EXIT_CODE)"

                    # Kubernetes rollout timeouts mean the objects exist and pods are
                    # being retried by the kubelet — not a true infrastructure failure.
                    # Not a retry — no second apply attempt happens either way.
                    if grep -qiE "(timed out waiting for the condition|Deployment.*timed out|StatefulSet.*timed out|rollout.*timed out|timed out.*[Dd]eployment|timed out.*[Ss]tateful[Ss]et|timed out.*rollout)" /tmp/k8s_apply_output.txt 2>/dev/null; then
                        log "⚠️  Kubernetes rollout timeout detected — infrastructure is provisioned"
                        log "ℹ️  Pods will continue health checks independently; treating as partial success"
                        return 0
                    fi

                    log "💥 K8s apply failed — not retrying automatically. Retry the deployment from the RAD dashboard."
                    return $$K8S_APPLY_EXIT_CODE
                }

                if k8s_apply_once; then
                    log "✅ Kubernetes resources deployed successfully"
                else
                    log "❌ Second apply failed — Kubernetes resources were not deployed"
                    exit 1
                fi
                ;;
            *)
                log "❌ Re-plan for Kubernetes resources failed (exit code: $$PLAN_EXIT_CODE)"
                exit 1
                ;;
        esac
    else
        log "ℹ️  kubernetes_ready=false — skipping Kubernetes resource deployment (cluster not yet available)"
    fi

    log "📤 Generating and uploading outputs..."

    if tofu output -json > output.json; then
        log "✅ Outputs generated successfully"

        # Upload outputs to GCS
        gsutil -m cp output.json "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/output/output.json"

        log "📊 Output summary:"
        tofu output 2>/dev/null || log "No outputs defined"
    else
        log "⚠️  Output generation failed, creating empty output file"
        echo "{}" > output.json
        gsutil -m cp output.json "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/output/output.json"
    fi

    log "✅ State refresh and output generation completed"
  dir: /workspace/modules/${_MODULE_NAME}

- id: 'Archive and Upload Deployment Files'
  name: '${_TERRAFORM_IMAGE_NAME}:latest'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    log() {
        echo "[$(date +'%H:%M:%S')] $$1"
    }

    log "📦 Creating deployment archive..."

    # Create archive from parent directory to avoid "file changed" error
    cd /workspace
    tar -hczf "${_MODULE_NAME}.tar.gz" -C "modules/${_MODULE_NAME}" .

    log "📤 Uploading deployment files..."

    # Upload the archive
    gsutil -m cp "${_MODULE_NAME}.tar.gz" "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/files/"

    # Update deployment metadata to reflect the commit and repo used in this update.
    # When the module was restored from the GCS archive (no git clone), skip the
    # git command and preserve the previously stored commit hash instead.
    if git -C /workspace rev-parse HEAD > /tmp/commit_hash.txt 2>/dev/null; then
        gsutil cp /tmp/commit_hash.txt "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/files/commit_hash.txt"
        log "✅ Updated commit_hash.txt: $$(cat /tmp/commit_hash.txt)"
    else
        log "ℹ️  No git repo in workspace (GCS archive fallback) — preserving stored commit hash"
    fi

    if [ -f /workspace/resolved_repo.txt ]; then
        gsutil cp /workspace/resolved_repo.txt "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/files/repo_url.txt"
        log "✅ Updated repo_url.txt: $$(cat /workspace/resolved_repo.txt)"
    fi

    # Create deployment completion marker
    COMPLETION_MARKER="{\"updated_at\": \"$$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"deployment_id\": \"${_DEPLOYMENT_ID}\", \"module\": \"${_MODULE_NAME}\", \"status\": \"updated\"}"
    echo "$$COMPLETION_MARKER" > /tmp/deployment_updated.json
    gsutil cp /tmp/deployment_updated.json "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/files/deployment_updated.json"

    log "📋 Archive contents:"
    tar -tzf "${_MODULE_NAME}.tar.gz" | head -20

    log "✅ Deployment files archived and uploaded"
    log "ℹ️  Note: terraform.tfvars.json and backend.tf managed by Cloud Function"
  dir: /workspace

- id: 'Deployment Summary'
  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:alpine'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    log() {
        echo "[$(date +'%H:%M:%S')] $$1"
    }

    echo "========================================"
    log "🎉 DEPLOYMENT UPDATE COMPLETED SUCCESSFULLY"
    echo "========================================"
    echo "Deployment Details:"
    echo "  • Module: ${_MODULE_NAME}"
    echo "  • Deployment ID: ${_DEPLOYMENT_ID}"
    echo "  • Project: ${PROJECT_ID}"
    echo "  • Completed: $$(date)"
    echo "========================================"
    echo "📁 Deployment Files:"
    echo "  • Archive: gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/files/${_MODULE_NAME}.tar.gz"
    echo "  • Outputs: gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/output/output.json"
    echo "  • Logs: gs://${_DEPLOYMENT_BUCKET_ID}/build-logs/update/${_MODULE_NAME}/${_DEPLOYMENT_ID}/"
    echo "========================================"
  dir: /workspace

# ✅ Dynamic secret configuration
availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/${_GITHUB_TOKEN_SECRET_NAME}/versions/latest
    env: 'GIT_TOKEN'

options:
  logging: GCS_ONLY
  logStreamingOption: STREAM_ON
  dynamic_substitutions: true
  substitutionOption: 'ALLOW_LOOSE'  # ✅ Allow empty substitutions
  # machineType: 'E2_HIGHCPU_8'  # More power for Terraform operations

# ✅ Add default substitutions
substitutions:
  _DEPLOYMENT_ID: "none"
  _MODULE_NAME: "unknown"
  _DEPLOYMENT_BUCKET_ID: "rad-deployments-2b65"
  _TERRAFORM_IMAGE_NAME: "us-central1-docker.pkg.dev/tec-rad-ui-2b65/opentofu-images/opentofu"
  _GIT_REPO_URL: "techequitycloud/rad-modules"  # Default platform repo
  _MODULE_GIT_REPO_URL: ""  # Empty by default, overridden for partner modules
  _GITHUB_TOKEN_SECRET_NAME: "git-access-token"  # Default token for platform modules

logsBucket: 'gs://${_DEPLOYMENT_BUCKET_ID}/build-logs/update/${_MODULE_NAME}/${_DEPLOYMENT_ID}'
timeout: 3600s
