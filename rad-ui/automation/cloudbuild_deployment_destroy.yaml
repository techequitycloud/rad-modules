steps:
- id: 'Prepare Destroy Environment'
  name: '${_TERRAFORM_IMAGE_NAME}:latest'
  entrypoint: 'bash'
  secretEnv: ['GIT_TOKEN']
  args:
  - '-c'
  # Kept inline deliberately and kept tiny: this preamble must run BEFORE the
  # script it launches, because that script wipes /workspace. Copy the pipeline's
  # own scripts to the shared volume, then exec from there — running the script
  # directly out of /workspace would have bash reading a file that the script
  # itself deletes partway through.
  - |
    set -e
    mkdir -p /pipeline
    if [ ! -d rad-ui/automation/scripts ]; then
        echo "❌ rad-ui/automation/scripts not found in the initial workspace"
        exit 1
    fi
    cp -a rad-ui/automation/scripts/. /pipeline/
    chmod +x /pipeline/*.sh
    exec bash /pipeline/prepare_destroy.sh
  # Cloud Build expands substitutions in this file, never inside a script file.
  env:
  - 'MODULE_NAME=${_MODULE_NAME}'
  - 'DEPLOYMENT_ID=${_DEPLOYMENT_ID}'
  - 'DEPLOYMENT_BUCKET_ID=${_DEPLOYMENT_BUCKET_ID}'
  - 'GIT_REPO_URL=${_GIT_REPO_URL}'
  - 'MODULE_GIT_REPO_URL=${_MODULE_GIT_REPO_URL}'
  volumes:
  - name: 'pipeline-scripts'
    path: '/pipeline'
  dir: /workspace

- id: 'Initialize and Validate State'
  name: '${_TERRAFORM_IMAGE_NAME}:latest'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    log() {
        echo "[$(date +'%H:%M:%S')] $$1"
    }

    if [ -f /workspace/NOTHING_TO_DESTROY ]; then
        echo "⏭️  Nothing was ever applied — skipping."
        exit 0
    fi

    log "🔧 Initializing Terraform/Tofu for destroy..."

    # Restore Terraform provider cache from GCS to avoid re-downloading binaries
    CACHE_DIR="/workspace/.terraform-plugin-cache"
    CACHE_GCS_PATH="gs://${_DEPLOYMENT_BUCKET_ID}/terraform-provider-cache/${_MODULE_NAME}/providers.tar.gz"
    mkdir -p "$$CACHE_DIR"
    export TF_PLUGIN_CACHE_DIR="$$CACHE_DIR"

    log "📥 Attempting to restore Terraform provider cache..."
    if gsutil cp "$$CACHE_GCS_PATH" /tmp/providers.tar.gz 2>/dev/null; then
        tar -xzf /tmp/providers.tar.gz -C "$$CACHE_DIR" 2>/dev/null || true
        rm -f /tmp/providers.tar.gz
        log "✅ Provider cache restored from GCS"
    else
        log "ℹ️  No provider cache found — providers will be downloaded fresh"
    fi

    # Checksum the cache before init so we can skip the upload if nothing changed
    CACHE_CHECKSUM_BEFORE=$$(find "$$CACHE_DIR" -type f | sort | xargs md5sum 2>/dev/null | md5sum || echo "empty")

    tofu init -reconfigure

    # Clear a state lock left behind by a previous build for THIS deployment
    # that was hard-killed (Cloud Build timeout, OOM, manual cancellation)
    # before it could release it — GCS backend locking has no automatic
    # staleness expiry, so an orphaned lock silently blocks every future
    # build for this deployment (including a user's own retry) indefinitely.
    # Safe unconditionally: the webapp's own idempotency claim
    # (deleteDeployment's teardownInFlight check) only lets a new build
    # start for this deployment once the previous one has already reached a
    # terminal Firestore status, itself only set after Cloud Build reports
    # that build as finished — so any process that could still legitimately
    # hold this lock is already gone by the time this build starts.
    # Confirmed live 2026-08-06: a Medusa_CloudRun build's Cloud Build
    # timeout orphaned this exact lock and blocked every subsequent retry
    # until manually cleared (found on the update pipeline; applied here too
    # since destroy shares the identical GCS-backend-locking exposure).
    LOCK_PATH="gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/state/default.tflock"
    if gsutil stat "$$LOCK_PATH" >/dev/null 2>&1; then
        log "⚠️  Found a leftover state lock from a previous build — clearing it"
        gsutil rm "$$LOCK_PATH" || log "⚠️  Failed to clear stale lock (may have already cleared itself)"
    fi

    # Only re-upload the provider cache if it changed
    CACHE_CHECKSUM_AFTER=$$(find "$$CACHE_DIR" -type f | sort | xargs md5sum 2>/dev/null | md5sum || echo "empty")
    if [ "$$CACHE_CHECKSUM_BEFORE" != "$$CACHE_CHECKSUM_AFTER" ]; then
        log "📤 Provider cache changed — saving to GCS..."
        if tar -czf /tmp/providers.tar.gz -C "$$CACHE_DIR" . 2>/dev/null && \
           gsutil cp /tmp/providers.tar.gz "$$CACHE_GCS_PATH" 2>/dev/null; then
            log "✅ Provider cache saved to GCS"
        else
            log "⚠️  Failed to save provider cache (non-critical)"
        fi
        rm -f /tmp/providers.tar.gz
    else
        log "ℹ️  Provider cache unchanged — skipping upload"
    fi

    log "🔍 Validating current state..."

    mkdir -p /workspace/audit
    if tofu show -json > /workspace/audit/pre_destroy_state.json 2>/dev/null; then
        RESOURCE_COUNT=$$(jq -r '.values.root_module.resources // [] | length' /workspace/audit/pre_destroy_state.json 2>/dev/null || echo "unknown")
        log "📊 Found $$RESOURCE_COUNT resources in state"

        log "📋 Planning destroy..."
        tofu plan -destroy -input=false -out=destroy.tfplan

        log "⚠️  Resources to be destroyed:"
        tofu show -json destroy.tfplan | jq -r '.resource_changes[]? | select(.change.actions[] == "delete") | .address' 2>/dev/null || log "Unable to parse destroy plan"

        log "📝 Creating pre-destroy audit record..."
        jq -r '.values.root_module.resources[]? | "\(.type).\(.name) (\(.address))"' /workspace/audit/pre_destroy_state.json 2>/dev/null > /workspace/audit/pre_destroy_resources.txt || echo "No resources found" > /workspace/audit/pre_destroy_resources.txt

        gsutil -m cp /workspace/audit/pre_destroy_state.json "gs://${_DEPLOYMENT_BUCKET_ID}/build-logs/destroy/${_MODULE_NAME}/${_DEPLOYMENT_ID}/pre_destroy_state.json" || log "Failed to upload pre-destroy state"
        gsutil -m cp /workspace/audit/pre_destroy_resources.txt "gs://${_DEPLOYMENT_BUCKET_ID}/build-logs/destroy/${_MODULE_NAME}/${_DEPLOYMENT_ID}/pre_destroy_resources.txt" || log "Failed to upload resource list"

        log "✅ Pre-destroy audit completed"
    else
        log "⚠️  No state file found or state is empty"
        log "   This may indicate resources were already destroyed"

        echo '{"message": "No state found", "timestamp": "'$$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > /workspace/audit/pre_destroy_state.json
        gsutil cp /workspace/audit/pre_destroy_state.json "gs://${_DEPLOYMENT_BUCKET_ID}/build-logs/destroy/${_MODULE_NAME}/${_DEPLOYMENT_ID}/pre_destroy_state.json" || log "Failed to upload empty state"
    fi

    log "✅ State validation completed"
  dir: /workspace/modules/${_MODULE_NAME}

- id: 'Destroy Infrastructure'
  name: '${_TERRAFORM_IMAGE_NAME}:latest'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    log() {
        echo "[$(date +'%H:%M:%S')] $$1"
    }

    if [ -f /workspace/NOTHING_TO_DESTROY ]; then
        echo "⏭️  Nothing was ever applied — skipping."
        exit 0
    fi

    log "🔥 Starting infrastructure destroy..."

    mkdir -p /workspace/audit
    cat > /workspace/audit/destroy_metadata.json <<EOF
    {
      "module": "${_MODULE_NAME}",
      "deployment_id": "${_DEPLOYMENT_ID}",
      "project_id": "${PROJECT_ID}",
      "build_id": "${BUILD_ID}",
      "started_at": "$$(date -u +%Y-%m-%dT%H:%M:%SZ)",
      "initiated_by": "${_TRIGGERED_BY:-manual}",
      "bucket": "${_DEPLOYMENT_BUCKET_ID}"
    }
    EOF

    gsutil cp /workspace/audit/destroy_metadata.json "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/destroy/destroy_metadata.json" || log "Failed to upload metadata"

    destroy_with_retry() {
        # ONE attempt. Do not raise this to "wait out" a blocked destroy.
        #
        # Direct VPC Egress reserves a serverless-ipv4-* internal address per
        # Cloud Run revision, and GCP releases them 20-30 MINUTES after the
        # owning service is deleted. A previous 6-attempt budget tried to
        # outlast that window and could not: one real destroy burned 39m3s of
        # build time and still failed. Build minutes are billed; an operator
        # re-running the delete once the addresses have drained costs nothing.
        # So fail immediately and hand the retry back to the operator.
        local max_attempts=$${DESTROY_MAX_ATTEMPTS:-1}
        local short_backoff=60
        local long_backoff=300
        local attempt=1
        local final_exit_code=0
        local attempt_log=/workspace/destroy_attempt.log
        local state_repaired=false

        while [ $$attempt -le $$max_attempts ]; do
            log "💥 Destroy attempt $$attempt of $$max_attempts"

            # tee keeps the live build log while still capturing output for the
            # signature match below; PIPESTATUS[0] is tofu's own exit code.
            tofu destroy -auto-approve -input=false 2>&1 | tee "$$attempt_log"
            final_exit_code=$${PIPESTATUS[0]}

            if [ "$$final_exit_code" -eq 0 ]; then
                log "✅ Destroy successful on attempt $$attempt"
                break
            fi

            log "❌ Destroy failed on attempt $$attempt (exit code: $$final_exit_code)"

            # GKE bootstrap destroy race: when google_container_cluster is deleted
            # before kubernetes_namespace_v1, the Kubernetes provider loses its API
            # endpoint and defaults to localhost:80, so every kubernetes_* destroy
            # fails with "connection refused" — permanently. Re-running the delete
            # hits the identical state, so handing this back to the operator would
            # loop forever. It is therefore repaired here and retried ONCE.
            #
            # Exempt from max_attempts on purpose: it repairs state and waits for
            # NOTHING, so it costs no build time and is not what the 1-attempt
            # budget above is guarding against.
            if [ "$$state_repaired" = "false" ]; then
                REMAINING_K8S=$$(tofu state list 2>/dev/null | grep "^kubernetes_" || true)
                if [ -n "$$REMAINING_K8S" ]; then
                    CLUSTER_IN_STATE=$$(tofu state list 2>/dev/null | grep "^google_container_cluster\." || true)
                    if [ -z "$$CLUSTER_IN_STATE" ]; then
                        log "⚠️  GKE cluster is gone but Kubernetes resources remain in state"
                        log "    The Kubernetes API is unreachable — removing stuck resources from state..."
                        echo "$$REMAINING_K8S" | while IFS= read -r resource; do
                            log "   Removing from state: $$resource"
                            tofu state rm "$$resource" || log "   ⚠️ Could not remove $$resource"
                        done
                        state_repaired=true
                        log "✅ Stuck Kubernetes resources removed — retrying once, immediately"
                        continue
                    fi
                fi
            fi

            if [ $$attempt -ge $$max_attempts ]; then
                log "💥 Destroy failed — not retrying (max_attempts=$$max_attempts)"
                if grep -qiE 'resourceInUseByAnotherResource|is already being used by|serverless-ipv4' "$$attempt_log" 2>/dev/null; then
                    log "   Cause: GCP has not yet released resources this destroy needs."
                    log "   serverless-ipv4-* addresses are freed 20-30 min AFTER the Cloud Run"
                    log "   services using them are deleted. Wait for that, then delete again."
                fi
                log "🔍 Checking for remaining resources..."
                tofu show -json 2>/dev/null | jq -r '.values.root_module.resources[]?.address // empty' | head -10 || log "Unable to list remaining resources"
                break
            fi

            # Only reachable when DESTROY_MAX_ATTEMPTS is raised deliberately.
            if grep -qiE 'resourceInUseByAnotherResource|is already being used by|serverless-ipv4' "$$attempt_log" 2>/dev/null; then
                log "⏳ Resource still held by GCP (async release lag) — waiting $$long_backoff seconds..."
                sleep $$long_backoff
            else
                log "⏳ Waiting $$short_backoff seconds before retry..."
                sleep $$short_backoff
            fi

            log "🔄 Refreshing state before retry..."
            tofu apply -refresh-only -auto-approve || log "State refresh failed, continuing with retry"

            ((attempt++))
        done

        return $$final_exit_code
    }

    destroy_with_retry
    DESTROY_EXIT_CODE=$$?

    echo $$DESTROY_EXIT_CODE > /workspace/audit/destroy_exit_code.txt

    DESTROY_STATUS="success"
    if [ $$DESTROY_EXIT_CODE -ne 0 ]; then
        DESTROY_STATUS="failed"
    fi

    cat > /workspace/audit/destroy_metadata.json <<EOF
    {
      "module": "${_MODULE_NAME}",
      "deployment_id": "${_DEPLOYMENT_ID}",
      "project_id": "${PROJECT_ID}",
      "build_id": "${BUILD_ID}",
      "started_at": "$$(date -u +%Y-%m-%dT%H:%M:%SZ)",
      "completed_at": "$$(date -u +%Y-%m-%dT%H:%M:%SZ)",
      "initiated_by": "${_TRIGGERED_BY:-manual}",
      "bucket": "${_DEPLOYMENT_BUCKET_ID}",
      "exit_code": $$DESTROY_EXIT_CODE,
      "status": "$$DESTROY_STATUS"
    }
    EOF

    gsutil cp /workspace/audit/destroy_metadata.json "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/destroy/destroy_metadata.json" || log "Failed to upload final metadata"

    log "🎯 Infrastructure destroy completed with exit code: $$DESTROY_EXIT_CODE"

    exit $$DESTROY_EXIT_CODE
  dir: /workspace/modules/${_MODULE_NAME}

- id: 'Verify Destroy and Cleanup'
  name: '${_TERRAFORM_IMAGE_NAME}:latest'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -e

    log() {
        echo "[$(date +'%H:%M:%S')] $$1"
    }

    log "🔍 Verifying destroy completion..."

    mkdir -p /workspace/audit

    REMAINING_COUNT=0
    VERIFICATION_STATUS="success"
    VERIFICATION_MESSAGE="All resources successfully destroyed"

    # Nothing was ever applied, so there is no state to verify — but the
    # GCS cleanup below MUST still run, otherwise the deployment folder
    # lingers and the deployment cannot be cleared.
    if [ -f /workspace/NOTHING_TO_DESTROY ]; then
        log "⏭️  No infrastructure was applied — skipping state verification."
    elif tofu show -json > /workspace/audit/post_destroy_state.json 2>/dev/null; then
        REMAINING_COUNT=$$(jq -r '.values.root_module.resources // [] | length' /workspace/audit/post_destroy_state.json 2>/dev/null || echo "0")

        if [ "$$REMAINING_COUNT" = "0" ]; then
            log "✅ All resources successfully destroyed"
        else
            log "⚠️  Warning: $$REMAINING_COUNT resources may still exist"
            log "📋 Remaining resources:"
            jq -r '.values.root_module.resources[]?.address // empty' /workspace/audit/post_destroy_state.json 2>/dev/null || log "Unable to list remaining resources"
            VERIFICATION_STATUS="partial"
            VERIFICATION_MESSAGE="$$REMAINING_COUNT resources may still exist in state"

            jq -r '.values.root_module.resources[]? | "\(.type).\(.name) (\(.address))"' /workspace/audit/post_destroy_state.json 2>/dev/null > /workspace/audit/remaining_resources.txt || echo "Unable to list" > /workspace/audit/remaining_resources.txt
        fi
    else
        log "✅ State is clean - no resources found"
        echo '{"message": "No state found after destroy", "timestamp": "'$$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > /workspace/audit/post_destroy_state.json
    fi

    AUDIT_BASE="gs://${_DEPLOYMENT_BUCKET_ID}/build-logs/destroy/${_MODULE_NAME}/${_DEPLOYMENT_ID}"

    cat > /workspace/audit/destroy_verification.json <<EOF
    {
      "module": "${_MODULE_NAME}",
      "deployment_id": "${_DEPLOYMENT_ID}",
      "verified_at": "$$(date -u +%Y-%m-%dT%H:%M:%SZ)",
      "status": "$$VERIFICATION_STATUS",
      "message": "$$VERIFICATION_MESSAGE",
      "remaining_resources": $$REMAINING_COUNT
    }
    EOF

    cat > /workspace/audit/destroy_complete.json <<EOF
    {
      "module": "${_MODULE_NAME}",
      "deployment_id": "${_DEPLOYMENT_ID}",
      "project_id": "${PROJECT_ID}",
      "build_id": "${BUILD_ID}",
      "destroyed_at": "$$(date -u +%Y-%m-%dT%H:%M:%SZ)",
      "verification_status": "$$VERIFICATION_STATUS",
      "build_logs": "$$AUDIT_BASE/"
    }
    EOF

    gsutil -m cp \
        /workspace/audit/destroy_verification.json \
        /workspace/audit/destroy_complete.json \
        /workspace/audit/post_destroy_state.json \
        "$$AUDIT_BASE/" || log "Failed to upload some audit files"

    if [ -f /workspace/audit/remaining_resources.txt ]; then
        gsutil cp /workspace/audit/remaining_resources.txt "$$AUDIT_BASE/remaining_resources.txt" || log "Failed to upload remaining resources list"
    fi

    log "✅ Destroy verification completed"

    log "🗑️  Removing deployment folder from Cloud Storage..."

    if gsutil ls "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/" > /dev/null 2>&1; then
        log "📁 Found deployment folder: gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}"

        log "📋 Contents to be deleted:"
        gsutil du -sh "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/" || log "Unable to calculate size"

        if gsutil -m rm -r "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/" 2>&1; then
            log "✅ Successfully removed deployment folder from Cloud Storage"
        else
            log "⚠️  Failed to remove deployment folder (may require manual cleanup)"
            log "   Path: gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}"
        fi

        if gsutil ls "gs://${_DEPLOYMENT_BUCKET_ID}/deployments/${_MODULE_NAME}/${_DEPLOYMENT_ID}/" > /dev/null 2>&1; then
            log "❌ Warning: Deployment folder still exists after deletion attempt"
        else
            log "✅ Confirmed: Deployment folder has been removed"
        fi
    else
        log "ℹ️  Deployment folder not found or already removed"
    fi

    log "🎉 Complete cleanup finished!"
  dir: /workspace/modules/${_MODULE_NAME}

- id: 'Destroy Summary'
  name: '${_TERRAFORM_IMAGE_NAME}:latest'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    log() {
        echo "[$(date +'%H:%M:%S')] $$1"
    }

    echo "========================================="
    log "🔥 INFRASTRUCTURE DESTROY COMPLETED"
    echo "========================================="
    echo "Destroy Details:"
    echo "  • Module: ${_MODULE_NAME}"
    echo "  • Deployment ID: ${_DEPLOYMENT_ID}"
    echo "  • Project: ${PROJECT_ID}"
    echo "  • Build ID: ${BUILD_ID}"
    echo "  • Completed: $$(date)"
    echo "========================================="
    echo "⚠️ IMPORTANT: Deployment deleted from GCS"
    echo "========================================="
    echo "📝 Audit Trail Preserved:"
    echo "  • Build Logs: gs://${_DEPLOYMENT_BUCKET_ID}/build-logs/destroy/${_MODULE_NAME}/${_DEPLOYMENT_ID}/"
    echo "========================================="
    echo "Note: Audit files were uploaded to the deployment"
    echo "folder before deletion. Build logs contain the"
    echo "complete destroy process for compliance."
    echo "========================================="
  dir: /workspace

options:
  logging: GCS_ONLY
  logStreamingOption: STREAM_ON
  dynamic_substitutions: true
  substitutionOption: 'ALLOW_LOOSE'

substitutions:
  _DEPLOYMENT_ID: "none"
  _GIT_REPO_URL: "techequitycloud/rad-modules"
  _MODULE_GIT_REPO_URL: ""
  _GITHUB_TOKEN_SECRET_NAME: "git-access-token"

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/${_GITHUB_TOKEN_SECRET_NAME}/versions/latest
    env: 'GIT_TOKEN'

logsBucket: 'gs://${_DEPLOYMENT_BUCKET_ID}/build-logs/destroy/${_MODULE_NAME}/${_DEPLOYMENT_ID}'
timeout: 3600s
