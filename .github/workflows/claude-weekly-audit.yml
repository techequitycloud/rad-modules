name: Weekly Convention & Doc Audit

# Runs every Sunday at 02:00 UTC. Catches convention and documentation drift that
# accumulates between PRs:
#   - Convention drift across all modules (scripts/check_conventions.py)
#   - CLAUDE.md "Module Families" / README module list vs actual modules/
#   - README Inputs/Outputs tables vs variables.tf/outputs.tf
#   - module_documentation lab-guide URLs and docs/labs/<Module>.md presence
#   - Script/path references in CLAUDE.md, AGENTS.md, README.md, SKILLS.md
#
# Opens a GitHub issue labelled "doc-audit" when problems are found; appends a
# comment if an open one already exists. Manually triggerable via workflow_dispatch.
#
# When scripts/check_conventions.py reports a FAIL (a hard invariant violated on
# main), the issue is ALSO tagged "convention-drift" — applied deterministically
# from the checker output, so it works even if the Claude doc audit is CLEAN or
# ANTHROPIC_API_KEY is unset, and an issue is opened for the FAIL on its own.
# WARN findings (legitimate per-module variation) stay in the audit narrative but
# do not trigger the label.
#
# Prerequisites:
#   - Add ANTHROPIC_API_KEY to the repository secrets
#   - Create the "doc-audit" and "convention-drift" labels (Settings -> Labels)

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Required by google-github-actions/auth for the WIF token exchange.
  id-token: write

jobs:
  doc-audit:
    name: Convention & Doc Audit
    runs-on: ubuntu-latest

    # `secrets` is not reliably available in a step-level `if:`; `env` is.
    # Gating keeps a repo whose WIF is not wired from showing a
    # permanently-failing auth step.
    env:
      HAS_WIF: ${{ secrets.WIF_PROVIDER != '' && secrets.WIF_SERVICE_ACCOUNT != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Secret Manager is the ONE durable copy of this credential; the
      # repository secret is the fallback that keeps this file working in a
      # repo whose WIF is not wired. Which source was used is PRINTED, so a
      # silent fall back to a drifting hand-copied secret is visible.
      - name: Authenticate to Google Cloud
        id: gcpauth
        if: env.HAS_WIF == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: ${{ steps.gcpauth.outcome == 'success' }}
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve the Anthropic API key
        id: key
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          FALLBACK_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          K=""
          SOURCE="repository secret"
          if [ "${{ steps.gcpauth.outcome }}" = "success" ] && [ -n "$GCP_PROJECT" ]; then
            K=$(gcloud secrets versions access latest \
                  --secret=anthropic-api-key --project="$GCP_PROJECT" 2>/dev/null || true)
            [ -n "$K" ] && SOURCE="Secret Manager (${GCP_PROJECT}/anthropic-api-key)"
          fi
          [ -n "$K" ] || K="$FALLBACK_KEY"

          if [ -z "$K" ]; then
            echo "::error title=No Anthropic API key::Neither Secret Manager nor the ANTHROPIC_API_KEY repository secret yielded a key."
            exit 1
          fi

          echo "::add-mask::$K"
          echo "key=$K" >> "$GITHUB_OUTPUT"
          echo "🔑 Using the key from: ${SOURCE}"

      - name: Run convention checker (input for the audit)
        run: python3 scripts/check_conventions.py --modules-dir modules/ > /tmp/conventions.txt 2>&1 || true

      - name: Run audit
        env:
          ANTHROPIC_API_KEY: ${{ steps.key.outputs.key }}
          # Haiku, overridable per repo without editing this file.
          REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-haiku-4-5' }}
        run: |
          # Prompt body lives in a separate file so this YAML never embeds a
          # column-0 heredoc.
          # Stderr goes to the LOG and a separate file -- NOT into /tmp/audit.txt.
          # The previous version redirected 2>&1 into /tmp/audit.txt and then
          # truncated that same file in a `|| echo` fallback, so the real error was
          # destroyed twice over: gone from the comment, and absent from the log
          # (stderr never reached it). The fallback also returned 0, so the job went
          # green having reviewed nothing. A check that cannot run must go RED.
          set +e
          claude --dangerously-skip-permissions \
            --allowedTools "Read,Grep,Glob,Bash" \
            --model "$REVIEW_MODEL" \
            --output-format json \
            -p "$(cat .github/claude-prompts/weekly-audit.md)" > /tmp/claude.json 2> /tmp/audit.err
          rc=$?
          set -e

          # Extract BEFORE the rc check: a run that FAILED still reports usage,
          # and a failed audit that cost money is the one worth measuring.
          if [ -s /tmp/claude.json ]; then
            jq -r '.result // ""' /tmp/claude.json > /tmp/audit.txt 2>/dev/null || : > /tmp/audit.txt

            COST=$(jq -r '.total_cost_usd // 0' /tmp/claude.json)
            IN=$(jq -r '.usage.input_tokens // 0' /tmp/claude.json)
            OUT=$(jq -r '.usage.output_tokens // 0' /tmp/claude.json)
            CR=$(jq -r '.usage.cache_read_input_tokens // 0' /tmp/claude.json)
            CC=$(jq -r '.usage.cache_creation_input_tokens // 0' /tmp/claude.json)
            TURNS=$(jq -r '.num_turns // 0' /tmp/claude.json)
            SECS=$(jq -r '((.duration_ms // 0) / 1000 * 10 | round) / 10' /tmp/claude.json)

            echo "💸 model=${REVIEW_MODEL} cost=\$${COST} turns=${TURNS} ${SECS}s | tokens in=${IN} out=${OUT} cache_read=${CR} cache_write=${CC}"
            {
              echo "### Audit cost"
              echo ""
              echo "| model | cost | turns | duration | in | out | cache read | cache write |"
              echo "|---|---|---|---|---|---|---|---|"
              echo "| \`${REVIEW_MODEL}\` | \$${COST} | ${TURNS} | ${SECS}s | ${IN} | ${OUT} | ${CR} | ${CC} |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            : > /tmp/audit.txt
          fi

          if [ -s /tmp/audit.err ]; then
            echo "--- claude stderr ---"
            cat /tmp/audit.err
          fi

          if [ "$rc" -ne 0 ]; then
            # claude can exit non-zero having written NOTHING to stderr -- its
            # error goes to stdout, i.e. into the raw capture. Dump it here or the
            # check goes red saying only that it went red.
            # The RAW capture, not the extracted .result, which is empty on
            # exactly this path. This workflow has already lost its
            # diagnostic once by dumping the wrong file.
            if [ -s /tmp/claude.json ]; then
              echo "--- claude stdout ---"
              cat /tmp/claude.json
            fi
            echo "::error title=Claude audit failed::claude exited $rc -- no audit was produced."
            exit "$rc"
          fi

          if [ ! -s /tmp/audit.txt ]; then
            echo "::error title=Claude audit empty::claude exited 0 but wrote no output."
            exit 1
          fi

      - name: Create or update issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = fs.readFileSync('/tmp/audit.txt', 'utf8').trim();

            // Read the deterministic convention-checker output and decide, on its
            // own (independent of Claude), whether convention drift is present.
            let conventions = '';
            try {
              conventions = fs.readFileSync('/tmp/conventions.txt', 'utf8').trim();
            } catch (e) { /* checker step may not have produced output */ }
            // FAIL only — WARN findings are legitimate per-module variation
            // (attached-cluster modules omit outputs.tf, etc.) and persist by
            // design, so they would pin the label on every issue. FAIL = a hard
            // invariant violated on main, which is actionable.
            const hasConventionFindings = /^\s*FAIL\s/m.test(conventions);
            const auditClean = audit === 'CLEAN';

            // Nothing to report only when BOTH the doc audit is clean AND the
            // checker found no drift.
            if (auditClean && !hasConventionFindings) {
              console.log('Audit passed — no convention or documentation drift detected.');
              return;
            }

            const today = new Date().toISOString().slice(0, 10);
            const title = `Weekly convention/doc audit findings — ${today}`;

            // When Claude reported CLEAN but the checker found drift, surface the
            // checker output directly so the issue is not just the word "CLEAN".
            const reportBody = auditClean
              ? '_Documentation audit: CLEAN._\n\n' +
                '## Convention drift (scripts/check_conventions.py)\n\n' +
                '```\n' + conventions + '\n```'
              : audit;
            const body = `${reportBody}\n\n---\n_Generated by ` +
              `[claude-weekly-audit.yml](.github/workflows/claude-weekly-audit.yml) ` +
              `on ${today}_`;

            const labels = hasConventionFindings
              ? ['doc-audit', 'convention-drift']
              : ['doc-audit'];

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'doc-audit',
              state: 'open',
            });

            const existing = issues.find(i => i.title.startsWith('Weekly convention/doc audit'));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `**Re-run on ${today}:**\n\n${reportBody}`,
              });
              if (hasConventionFindings) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  labels: ['convention-drift'],
                });
              }
              console.log(`Appended to existing issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
              console.log(`Created issue #${issue.number}: ${title}`);
            }
