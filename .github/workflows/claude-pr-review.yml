name: Claude Semantic Review

# Posts a review comment on every PR to main covering the checks the static CI
# (terraform-ci.yml) and the convention checker cannot perform on their own:
#   - Convention drift (summarised from scripts/check_conventions.py + judgement)
#   - License headers, UIMeta completeness, API-enablement invariant
#   - Hardcoded multi-cloud credentials (Azure/AWS) and missing sensitive flags
#   - Documentation drift (README Inputs/Outputs vs variables.tf/outputs.tf,
#     module_documentation lab-guide URL)
#
# Prerequisites:
#   - Add ANTHROPIC_API_KEY to the repository secrets
#   - The job already requests pull-requests: write
#
# Security: untrusted PR fields (title/body/branch) are never interpolated into a
# run: step. Only github.base_ref (a branch name) is passed, via an env var.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  # Required by google-github-actions/auth for the WIF token exchange.
  id-token: write

jobs:
  semantic-review:
    name: Semantic Review
    runs-on: ubuntu-latest

    # `secrets` is not reliably available in a step-level `if:`; `env` is.
    # Gating keeps a repo whose WIF is not wired from showing a
    # permanently-failing auth step.
    env:
      HAS_WIF: ${{ secrets.WIF_PROVIDER != '' && secrets.WIF_SERVICE_ACCOUNT != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Secret Manager is the ONE durable copy of this credential; the
      # repository secret is the fallback that keeps this file working in a
      # repo whose WIF is not wired. Which source was used is PRINTED, so a
      # silent fall back to a drifting hand-copied secret is visible.
      - name: Authenticate to Google Cloud
        id: gcpauth
        if: env.HAS_WIF == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: ${{ steps.gcpauth.outcome == 'success' }}
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve the Anthropic API key
        id: key
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          FALLBACK_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          K=""
          SOURCE="repository secret"
          if [ "${{ steps.gcpauth.outcome }}" = "success" ] && [ -n "$GCP_PROJECT" ]; then
            K=$(gcloud secrets versions access latest \
                  --secret=anthropic-api-key --project="$GCP_PROJECT" 2>/dev/null || true)
            [ -n "$K" ] && SOURCE="Secret Manager (${GCP_PROJECT}/anthropic-api-key)"
          fi
          [ -n "$K" ] || K="$FALLBACK_KEY"

          if [ -z "$K" ]; then
            echo "::error title=No Anthropic API key::Neither Secret Manager nor the ANTHROPIC_API_KEY repository secret yielded a key."
            exit 1
          fi

          echo "::add-mask::$K"
          echo "key=$K" >> "$GITHUB_OUTPUT"
          echo "🔑 Using the key from: ${SOURCE}"

      - name: Run convention checker (machine-readable input for the review)
        run: python3 scripts/check_conventions.py --modules-dir modules/ > /tmp/conventions.txt 2>&1 || true

      - name: Run semantic review
        env:
          ANTHROPIC_API_KEY: ${{ steps.key.outputs.key }}
          # Haiku, overridable per repo without editing this file.
          REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-haiku-4-5' }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null \
            || echo "(unable to determine changed files)")

          # Prompt body lives in a separate file so this YAML never embeds a
          # column-0 heredoc. The changed-file list (derived from BASE_REF, a
          # branch name) is appended via an env var — no untrusted PR text
          # (title/body) ever reaches the shell.
          {
            cat .github/claude-prompts/pr-review.md
            echo
            echo "Changed files in this PR:"
            echo "${CHANGED}"
          } > /tmp/prompt.txt

          # Stderr goes to the LOG and a separate file -- NOT into /tmp/review.txt.
          # The previous version redirected 2>&1 into /tmp/review.txt and then
          # truncated that same file in a `|| echo` fallback, so the real error was
          # destroyed twice over: gone from the comment, and absent from the log
          # (stderr never reached it). The fallback also returned 0, so the job went
          # green having reviewed nothing. A check that cannot run must go RED.
          set +e
          claude --dangerously-skip-permissions \
            --allowedTools "Read,Grep,Glob,Bash" \
            --model "$REVIEW_MODEL" \
            --output-format json \
            -p "$(cat /tmp/prompt.txt)" > /tmp/claude.json 2> /tmp/review.err
          rc=$?
          set -e

          # Extract BEFORE the rc check: a run that FAILED still reports usage,
          # and a failed review that cost money is the one worth measuring.
          if [ -s /tmp/claude.json ]; then
            jq -r '.result // ""' /tmp/claude.json > /tmp/review.txt 2>/dev/null || : > /tmp/review.txt

            COST=$(jq -r '.total_cost_usd // 0' /tmp/claude.json)
            IN=$(jq -r '.usage.input_tokens // 0' /tmp/claude.json)
            OUT=$(jq -r '.usage.output_tokens // 0' /tmp/claude.json)
            CR=$(jq -r '.usage.cache_read_input_tokens // 0' /tmp/claude.json)
            CC=$(jq -r '.usage.cache_creation_input_tokens // 0' /tmp/claude.json)
            TURNS=$(jq -r '.num_turns // 0' /tmp/claude.json)
            SECS=$(jq -r '((.duration_ms // 0) / 1000 * 10 | round) / 10' /tmp/claude.json)

            echo "💸 model=${REVIEW_MODEL} cost=\$${COST} turns=${TURNS} ${SECS}s | tokens in=${IN} out=${OUT} cache_read=${CR} cache_write=${CC}"
            {
              echo "### Review cost"
              echo ""
              echo "| model | cost | turns | duration | in | out | cache read | cache write |"
              echo "|---|---|---|---|---|---|---|---|"
              echo "| \`${REVIEW_MODEL}\` | \$${COST} | ${TURNS} | ${SECS}s | ${IN} | ${OUT} | ${CR} | ${CC} |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            : > /tmp/review.txt
          fi

          if [ -s /tmp/review.err ]; then
            echo "--- claude stderr ---"
            cat /tmp/review.err
          fi

          if [ "$rc" -ne 0 ]; then
            # claude can exit non-zero having written NOTHING to stderr -- its
            # error goes to stdout, i.e. into the raw capture. Dump it here or the
            # check goes red saying only that it went red.
            # The RAW capture, not the extracted .result, which is empty on
            # exactly this path. This workflow has already lost its
            # diagnostic once by dumping the wrong file.
            if [ -s /tmp/claude.json ]; then
              echo "--- claude stdout ---"
              cat /tmp/claude.json
            fi
            echo "::error title=Claude review failed::claude exited $rc -- no review was produced."
            exit "$rc"
          fi

          if [ ! -s /tmp/review.txt ]; then
            echo "::error title=Claude review empty::claude exited 0 but wrote no output."
            exit 1
          fi

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const findings = fs.readFileSync('/tmp/review.txt', 'utf8').trim();
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `## Claude Semantic Review (${sha})\n\n${findings}\n\n` +
              `<sub>Checks: convention drift · standard vars/UIMeta · API invariant · credentials · doc drift</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## Claude Semantic Review')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
